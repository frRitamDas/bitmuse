name: One-time Pexpo bugfix

on:
  push:
    branches: [main]

permissions:
  contents: write

auto_cancel:

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply safe bug fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"{label}: target text not found; refusing partial patch")
              if s.count(old) != 1:
                  raise SystemExit(f"{label}: target occurs {s.count(old)} times; refusing ambiguous patch")
              p.write_text(s.replace(old, new))

          # Bug #1: the selector was refreshed from persistence, but newly fetched
          # channel thumbnails were not refreshed until the next app start.
          replace(
              'app/src/main/java/com/music/bitchord/ui/MainViewModel.kt',
              '''    fun refreshGoogleAccounts() {\n        _googleAccounts.value = authStore.sessions\n        _activeAccountId.value = authStore.activeSession?.accountId\n        _activeProfileId.value = authStore.activeProfileId\n    }''',
              '''    fun refreshGoogleAccounts() {\n        _googleAccounts.value = authStore.sessions\n        _activeAccountId.value = authStore.activeSession?.accountId\n        _activeProfileId.value = authStore.activeProfileId\n\n        // A fresh sign-in can have the session immediately while the YouTube\n        // channel/profile thumbnails are still missing. Reuse the existing\n        // authoritative channel fetch; its result updates the same session\n        // objects while the selector is already open, so no restart is needed.\n        if (authStore.sessions.any { session ->\n                session.profiles.any { profile -> profile.avatar.isNullOrBlank() }\n            }) {\n            loadChannels(force = true)\n        }\n    }''',
              'Bug #1 account refresh',
          )

          # Bug #2: meteredness is deliberately not the same thing as transport.
          # A Wi-Fi network may be marked metered by Android/OEM policy. The UI\n          # therefore reads TRANSPORT_WIFI/CELLULAR for the label/badge while\n          # AppSettings.meteredConnection remains the billing/quality signal.
          replace(
              'app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt',
              '''    val metered by AppSettings.meteredConnection.collectAsStateWithLifecycle()\n''',
              '''    val metered by AppSettings.meteredConnection.collectAsStateWithLifecycle()\n    val activeTransport = remember(metered) {\n        val manager = context.getSystemService(android.net.ConnectivityManager::class.java)\n        val network = manager?.activeNetwork\n        val capabilities = network?.let { manager.getNetworkCapabilities(it) }\n        when {\n            capabilities?.hasTransport(android.net.NetworkCapabilities.TRANSPORT_WIFI) == true -> "wifi"\n            capabilities?.hasTransport(android.net.NetworkCapabilities.TRANSPORT_CELLULAR) == true -> "cellular"\n            else -> "other"\n        }\n    }\n    val onWifi = activeTransport == "wifi"\n    val onCellular = activeTransport == "cellular"\n''',
              'Bug #2 transport state',
          )
          replace(
              'app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt',
              'badge = stringResource(R.string.in_use).takeIf { metered == false },',
              'badge = stringResource(R.string.in_use).takeIf { onWifi },',
              'Bug #2 Wi-Fi badge',
          )
          replace(
              'app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt',
              'badge = stringResource(R.string.in_use).takeIf { metered == true },',
              'badge = stringResource(R.string.in_use).takeIf { onCellular },',
              'Bug #2 cellular badge',
          )

          # Future-proof legacy-build gate. The current 1.5.1.4 build is explicitly
          # exempt; a build below the minimum shows a non-dismissible update gate.
          replace(
              'app/src/main/java/com/music/bitchord/BitChordApplication.kt',
              'import android.app.Application\n',
              'import android.app.Activity\nimport android.app.AlertDialog\nimport android.app.Application\nimport android.content.Intent\nimport android.net.Uri\n',
              'Legacy gate imports',
          )
          replace(
              'app/src/main/java/com/music/bitchord/BitChordApplication.kt',
              '''        super.onCreate()\n''',
              '''        super.onCreate()\n        registerActivityLifecycleCallbacks(object : ActivityLifecycleCallbacks {\n            override fun onActivityCreated(activity: Activity, state: android.os.Bundle?) = Unit\n            override fun onActivityStarted(activity: Activity) = Unit\n            override fun onActivityPaused(activity: Activity) = Unit\n            override fun onActivityStopped(activity: Activity) = Unit\n            override fun onActivitySaveInstanceState(activity: Activity, state: android.os.Bundle) = Unit\n            override fun onActivityDestroyed(activity: Activity) = Unit\n            override fun onActivityResumed(activity: Activity) {\n                if (isLegacyBuild()) showLegacyBuildGate(activity)\n            }\n        })\n''',
              'Legacy gate lifecycle',
          )
          marker = '''    private fun initLastfm() {\n'''
          addition = '''    private fun isLegacyBuild(): Boolean {\n        fun key(version: String): List<Int> {\n            val parts = version.removePrefix("v").split(".").map { it.toIntOrNull() ?: 0 }\n            if (parts.size == 4 && parts[2] == 1) {\n                return listOf(parts[0], parts[1], parts[3], 1)\n            }\n            return listOf(parts.getOrElse(0) { 0 }, parts.getOrElse(1) { 0 }, parts.getOrElse(2) { 0 }, 0)\n        }\n        return key(BuildConfig.VERSION_NAME).zip(key("1.5.1.4")).firstOrNull { (current, minimum) -> current != minimum }\n            ?.let { it.first < it.second } == true\n    }\n\n    private fun showLegacyBuildGate(activity: Activity) {\n        if (activity.isFinishing || activity.isDestroyed) return\n        if (activity is androidx.appcompat.app.AppCompatActivity && activity.isChangingConfigurations) return\n        AlertDialog.Builder(activity)\n            .setTitle("Pexpo update required")\n            .setMessage("This version of Pexpo is no longer supported. Please install Pexpo 1.5.1.4 or newer from Pexpo Updates.")\n            .setCancelable(false)\n            .setPositiveButton("Download latest") { _, _ ->\n                activity.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://pexpoupdates.xo.je")))\n                activity.finishAndRemoveTask()\n            }\n            .show()\n    }\n\n'''
          p = Path('app/src/main/java/com/music/bitchord/BitChordApplication.kt')
          s = p.read_text()
          if s.count(marker) != 1:
              raise SystemExit('Legacy gate method insertion target not unique')
          p.write_text(s.replace(marker, addition + marker))
          PY

      - name: Verify source patch
        shell: bash
        run: |
          grep -q 'loadChannels(force = true)' app/src/main/java/com/music/bitchord/ui/MainViewModel.kt
          grep -q 'TRANSPORT_WIFI' app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
          grep -q 'Pexpo update required' app/src/main/java/com/music/bitchord/BitChordApplication.kt
          grep -q '1.5.1.4' app/src/main/java/com/music/bitchord/BitChordApplication.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Pexpo release
        run: ./gradlew assembleProdRelease --stacktrace

      - name: Remove superseded GitHub releases and Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name != "v1.5.1.4") | .tag_name' | while read -r tag; do
            [ -z "$tag" ] || gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name != "pexpo-v1.5.1.4-release") | .id' | while read -r id; do
            [ -z "$id" ] || gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
          done

      - name: Commit and clean up
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/MainViewModel.kt \
                  app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt \
                  app/src/main/java/com/music/bitchord/BitChordApplication.kt
          git rm -f .github/workflows/one-time-pexpo-bugfix.yml
          git commit -m "fix: account avatar network indicator and legacy gate"
          git push origin main
