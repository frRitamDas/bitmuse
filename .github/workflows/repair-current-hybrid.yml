name: Repair current hybrid state

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'Repair current hybrid state') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Patch source coherently
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # Remove compatibility shims that were only needed before the exact
          # brand-channel revert was reapplied. The restored implementation
          # already supplies these types/functions.
          for rel in [
              'app/src/main/java/com/music/bitchord/data/model/AccountChannel.kt',
              'app/src/main/java/com/music/bitchord/data/AccountChannelsCompat.kt',
              'app/src/main/java/com/music/bitchord/data/innertube/SessionScopeCompat.kt',
          ]:
              p = root / rel
              if p.exists(): p.unlink()

          # AuthStore: restore the multi-account persistence keys that were
          # lost in the partial merge, and make sign-out clear them too.
          p = root / 'app/src/main/java/com/music/bitchord/auth/AuthStore.kt'
          s = p.read_text()
          if 'private const val KEY_SESSIONS' not in s:
              s = s.replace(
                  '        private const val KEY_COOKIE = "cookie"\n',
                  '        private const val KEY_COOKIE = "cookie"\n'
                  '        private const val KEY_SESSIONS = "google_account_sessions_v2"\n'
                  '        private const val KEY_ACTIVE_ACCOUNT = "active_google_account_id_v2"\n'
                  '        private const val KEY_ACTIVE_PROFILE = "active_youtube_profile_id_v2"\n'
              )
          s = s.replace(
              'prefs.edit().remove(KEY_COOKIE).apply()',
              'prefs.edit().remove(KEY_COOKIE).remove(KEY_SESSIONS)'
              '.remove(KEY_ACTIVE_ACCOUNT).remove(KEY_ACTIVE_PROFILE).apply()'
          )
          p.write_text(s)

          # YtMusicLoginScreen: the conflict resolver left two copies of the
          # top-level LOGIN_URL/TAG declarations. Keep the documented version.
          p = root / 'app/src/main/java/com/music/bitchord/auth/YtMusicLoginScreen.kt'
          s = p.read_text()
          duplicate = '''private const val LOGIN_URL =\n    "https://accounts.google.com/ServiceLogin" +\n        "?ltmpl=music&service=youtube&passive=true" +\n        "&continue=https%3A%2F%2Fmusic.youtube.com%2F"\n\nprivate const val TAG = "BitChord"\n\n'''
          s = s.replace(duplicate, '', 1)
          p.write_text(s)

          # MainActivity: the multi-account selector block is present, but its
          # Compose state declaration was lost during the revert merge.
          p = root / 'app/src/main/java/com/music/bitchord/MainActivity.kt'
          s = p.read_text()
          if 'var showAccountSelector by remember' not in s:
              marker = '    var showChannelPicker by remember { mutableStateOf(false) }\n'
              s = s.replace(marker, marker + '    var showAccountSelector by remember { mutableStateOf(false) }\n', 1)
          p.write_text(s)

          # MainViewModel: restore the multi-account source-of-truth state.
          p = root / 'app/src/main/java/com/music/bitchord/ui/MainViewModel.kt'
          s = p.read_text()
          account_state = '''\n    /** Source of truth for Google sessions and their YouTube identities. */\n    private val _googleAccounts = MutableStateFlow(authStore.sessions)\n    val googleAccounts: StateFlow<List<GoogleAccountSession>> = _googleAccounts.asStateFlow()\n    private val _activeAccountId = MutableStateFlow(authStore.activeSession?.accountId)\n    val activeAccountId: StateFlow<String?> = _activeAccountId.asStateFlow()\n    private val _activeProfileId = MutableStateFlow(authStore.activeProfileId)\n    val activeProfileId: StateFlow<String?> = _activeProfileId.asStateFlow()\n'''
          if 'private val _googleAccounts' not in s:
              marker = '    private val _selectedChannelName = MutableStateFlow(authStore.channelName)\n    val selectedChannelName: StateFlow<String?> = _selectedChannelName.asStateFlow()\n'
              s = s.replace(marker, marker + account_state, 1)

          # Make loadChannels also learn detected profiles for the multi-account
          # selector, while retaining the existing channel list behavior.
          old = '''            YtMusicRepository.accountChannels()\n                .onSuccess { _channels.value = it }\n'''
          new = '''            YtMusicRepository.accountChannels()\n                .onSuccess {\n                    _channels.value = it\n                    persistDetectedProfiles(it)\n                }\n'''
          s = s.replace(old, new, 1)

          # Restore the missing profile-management methods immediately before
          # the existing listener-state clearing method.
          if 'fun selectProfile(accountId: String' not in s:
              block = r'''\n    /** Selects an identity without ever allowing a response to replace it. */\n    fun selectProfile(accountId: String, selectedProfileId: String, supplied: YouTubeProfile? = null) {\n        val source = _googleAccounts.value.firstOrNull { it.accountId == accountId } ?: return\n        val profile = supplied ?: source.profiles.firstOrNull { it.profileId == selectedProfileId } ?: return\n        if (accountId == _activeAccountId.value && profile.profileId == _activeProfileId.value) return\n        cacheCurrentListener()\n        val updated = source.copy(\n            profiles = source.profiles.filterNot { it.profileId == profile.profileId } + profile,\n            activeProfileId = profile.profileId,\n        )\n        authStore.upsertSession(updated)\n        authStore.select(accountId, profile.profileId)\n        _googleAccounts.value = authStore.sessions\n        _activeAccountId.value = accountId\n        _activeProfileId.value = profile.profileId\n        authStore.cookie = updated.cookie\n        Innertube.cookie = updated.cookie\n        Innertube.selectChannel(profile.pageId, profile.dataSyncId, profile.authUser)\n        _selectedChannelKey.value = profile.profileId\n        _selectedChannelName.value = profile.name\n        StreamResolver.onSessionChanged()\n        clearListenerState(restoreCached = true)\n        reloadForAccount()\n    }\n\n    /** Returns false at an edge, allowing the avatar to play its elastic cue. */\n    fun stepProfile(forward: Boolean): Boolean {\n        val target = adjacentProfile(_googleAccounts.value, _activeAccountId.value, _activeProfileId.value, forward) ?: return false\n        selectProfile(target.first, target.second)\n        return true\n    }\n\n    fun removeAccount(accountId: String) {\n        val fallback = authStore.removeAccount(accountId)\n        _googleAccounts.value = authStore.sessions\n        if (fallback == null) { signOut(); return }\n        selectProfile(fallback.accountId, fallback.activeProfileId ?: fallback.profiles.firstOrNull()?.profileId ?: return)\n    }\n\n    private fun persistDetectedProfiles(channels: List<AccountChannel>) {\n        val accountId = _activeAccountId.value ?: return\n        val current = authStore.sessions.firstOrNull { it.accountId == accountId } ?: return\n        val detected = channels.map { channel ->\n            YouTubeProfile(\n                profileId(channel.pageId, channel.dataSyncId, channel.name),\n                channel.name, channel.subtitle, channel.thumbnailUrl,\n                channel.pageId, channel.dataSyncId,\n                isBrandAccount = channel.pageId != null,\n            )\n        }\n        val stale = if (detected.isEmpty()) emptySet() else current.profiles\n            .filter { it.profileId.startsWith("profile:") }\n            .map { it.profileId }\n            .toSet()\n        val profiles = current.profiles.filter { known ->\n            known.profileId !in stale && detected.none { it.profileId == known.profileId }\n        } + detected\n        val selected = when {\n            current.activeProfileId != null && current.activeProfileId !in stale -> current.activeProfileId\n            current.activeProfileId in stale -> detected.singleOrNull()?.profileId\n            else -> null\n        } ?: profiles.firstOrNull()?.profileId\n        authStore.upsertSession(current.copy(profiles = profiles, activeProfileId = selected), activate = false)\n        _googleAccounts.value = authStore.sessions\n    }\n'''
              marker = '    private fun clearListenerState() {'
              s = s.replace(marker, block + '\n' + marker, 1)

          # Replace the simple listener reset with the identity-aware version.
          old_reset = '''    private fun clearListenerState() {\n        LikeState.clear()\n        _playlists.value = emptyList()\n        _playlistOwned.value = emptyMap()\n        ownershipInFlight.clear()\n        _songMenu.value = null\n        _library.value = UiState.Loading\n        _history.value = UiState.Loading\n    }\n'''
          new_reset = '''    private fun cacheCurrentListener() {\n        val key = listenerKey() ?: return\n        listenerCache[key] = ListenerSnapshot(\n            _account.value, _library.value, _history.value, _playlists.value, _playlistOwned.value,\n        )\n    }\n\n    private fun listenerKey(): String? = _activeAccountId.value?.let { accountId ->\n        _activeProfileId.value?.let { profileId -> "$accountId:$profileId" }\n    }\n\n    private fun clearListenerState(restoreCached: Boolean = false) {\n        _account.value = null\n        LikeState.clear()\n        _playlistsLoading.value = false\n        _playlists.value = emptyList()\n        _playlistOwned.value = emptyMap()\n        ownershipInFlight.clear()\n        _songMenu.value = null\n        _library.value = UiState.Loading\n        _history.value = UiState.Loading\n        if (restoreCached) listenerCache[listenerKey()]?.let { cached ->\n            _account.value = cached.account\n            _library.value = cached.library\n            _history.value = cached.history\n            _playlists.value = cached.playlists\n            _playlistOwned.value = cached.owned\n        }\n    }\n'''
          s = s.replace(old_reset, new_reset, 1)

          # The restored session flow needs the pre-switch signed-in state.
          needle = '        StreamResolver.onSessionChanged()\n        _signedIn.value = true\n        if (wasSignedIn) clearListenerState()\n'
          if needle in s and 'val wasSignedIn = _signedIn.value' not in s[s.find('fun onWebSession'):s.find('fun onWebSession') + 8000]:
              s = s.replace(needle, '        StreamResolver.onSessionChanged()\n        val wasSignedIn = _signedIn.value\n        _signedIn.value = true\n        if (wasSignedIn) clearListenerState()\n', 1)

          p.write_text(s)

          print('Hybrid repair patches applied.')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair current hybrid state"
          git push origin HEAD:main
