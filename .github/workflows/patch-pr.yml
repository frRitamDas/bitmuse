name: Pexpo patch runner

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          root = Path('.')

          selector = root/'app/src/main/java/com/music/bitchord/ui/components/AccountProfileSelector.kt'
