name: Pexpo 1.5.1.4 Maintenance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_pexpo_1514.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/java/com/music/bitchord/MainActivity.kt app/src/main/java/com/music/bitchord/data/AppUpdateChecker.kt app/src/main/java/com/music/bitchord/data/sources/addon/SourceFormats.kt .github/workflows/android.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix: Pexpo 1.5.1.4 keyboard and system fixes [skip ci]'
          git push origin HEAD:main
