name: Pexpo 1.5.6 Avatar Hotfix

# Triggered intentionally to rebuild and republish the corrected v1.5.6 release.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pexpo-1.5.6-avatar-hotfix.yml'

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Last.fm credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          set -euo pipefail
          test -n "$LASTFM_API_KEY"
          test -n "$LASTFM_SECRET"
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties

      - name: Apply stable maintenance patch
        run: python3 scripts/patch_155.py

      - name: Patch account selector and avatar refresh
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          selector = Path('app/src/main/java/com/music/pexpo/ui/components/AccountProfileSelector.kt')
          text = selector.read_text(encoding='utf-8')
          text = text.replace('val canAddAccount = accounts.isEmpty()', 'val canAddAccount = true', 1)
          selector.write_text(text, encoding='utf-8')

          vm = Path('app/src/main/java/com/music/pexpo/ui/MainViewModel.kt')
          text = vm.read_text(encoding='utf-8')
          old = '''        if (authStore.sessions.any { session ->\n                session.profiles.any { profile -> profile.avatar.isNullOrBlank() }\n            }) {\n            loadChannels(force = true)\n        }'''
          new = '''        // The Google profile avatar can change without changing the saved\n        // session URL. Always refresh the authoritative YouTube channel data\n        // when the selector opens so the selector never shows a stale avatar.\n        if (_signedIn.value) loadChannels(force = true)'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'if (_signedIn.value) loadChannels(force = true)' not in text:
              raise SystemExit('Avatar refresh target not found')
          vm.write_text(text, encoding='utf-8')
          print('Applied: Add account enabled + selector avatar refresh.')
          PY

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Commit source fix without triggering another workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src
          if git diff --cached --quiet; then
            echo 'Source fix already present.'
          else
            git commit -m 'fix: refresh account selector avatars and enable multi-account [skip ci]'
            git push origin main
          fi

      - name: Setup permanent Pexpo release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing $name" >&2; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > pexpo-release.jks
          keytool -list -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo 'storeFile=pexpo-release.jks'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Verify permanent signing identity against Pexpo 1.5.5
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          mkdir -p baseline
          gh release download v1.5.5 --repo "$GITHUB_REPOSITORY" --pattern 'pexpo-1.5.5-universal.apk' --dir baseline --clobber
          keytool -exportcert -rfc -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > expected.pem
          expected=$(openssl x509 -in expected.pem -noout -fingerprint -sha256 | sed 's/.*=//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          actual=$($APKSIGNER verify --verbose --print-certs baseline/pexpo-1.5.5-universal.apk 2>&1 | grep -m1 'certificate SHA-256 digest:' | sed 's/.*: *//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          test "$expected" = "$actual"
          echo 'Verified permanent certificate matches Pexpo 1.5.5.'

      - name: Build Pexpo v1.5.6 production APKs
        run: ./gradlew assembleProdRelease --stacktrace

      - name: Force all production APKs to permanent certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/prod/release/*.apk; do
            tmp="$apk.signed"
            "$APKSIGNER" sign --ks pexpo-release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out "$tmp" "$apk"
            mv "$tmp" "$apk"
          done

      - name: Verify APK identity and certificates
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          keytool -exportcert -rfc -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > expected.pem
          expected=$(openssl x509 -in expected.pem -noout -fingerprint -sha256 | sed 's/.*=//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          for apk in app/build/outputs/apk/prod/release/*.apk; do
            output=$($APKSIGNER verify --verbose --print-certs "$apk" 2>&1)
            echo "$output"
            echo "$output" | grep -F 'Verifies' >/dev/null
            actual=$(printf '%s\n' "$output" | grep -m1 'certificate SHA-256 digest:' | sed 's/.*: *//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            test "$expected" = "$actual"
          done
          badging=$($AAPT dump badging app/build/outputs/apk/prod/release/app-prod-universal-release.apk)
          echo "$badging" | grep -F "package: name='com.music.pexpo'" >/dev/null
          echo "$badging" | grep -F "versionCode='20'" >/dev/null
          echo "$badging" | grep -F "versionName='1.5.6'" >/dev/null

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk release-assets/pexpo-1.5.6-universal.apk
          cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk release-assets/pexpo-1.5.6-arm64-v8a.apk
          cp app/build/outputs/apk/prod/release/app-prod-armeabi-v7a-release.apk release-assets/pexpo-1.5.6-armeabi-v7a.apk
          cp app/build/outputs/apk/prod/release/app-prod-x86_64-release.apk release-assets/pexpo-1.5.6-x86_64.apk
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pexpo-v1.5.6-avatar-hotfix
          path: release-assets/*

      - name: Publish Pexpo v1.5.6 with hotfix notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # Pexpo Music v1.5.6

          ## ✨ Multi-account & profile polish
          - **Add account is fully enabled** even when another Google account is already saved.
          - Each new account starts its own fresh Google authentication session.
          - Switching between saved accounts does not reopen Google sign-in.
          - **Account selector avatars now refresh from YouTube when the selector opens**, so a Google profile-picture change is reflected immediately instead of showing a stale cached profile.
          - Home and Account Selector now use the same refreshed profile identity data.

          ## 🔐 Production
          - Production identity remains `com.music.pexpo`.
          - Version **1.5.6 / versionCode 20**.
          - All four production APKs are explicitly signed with the same permanent certificate used by Pexpo 1.5.5.
          - SHA-256 checksums are included.
          EOF
          gh release edit v1.5.6 --repo "$GITHUB_REPOSITORY" --title 'Pexpo Music v1.5.6' --notes-file release-notes.md
          gh release upload v1.5.6 --repo "$GITHUB_REPOSITORY" --clobber release-assets/pexpo-1.5.6-universal.apk release-assets/pexpo-1.5.6-arm64-v8a.apk release-assets/pexpo-1.5.6-armeabi-v7a.apk release-assets/pexpo-1.5.6-x86_64.apk release-assets/SHA256SUMS.txt

      - name: Remove temporary hotfix workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/pexpo-1.5.6-avatar-hotfix.yml
          git commit -m 'chore: remove temporary 1.5.6 hotfix workflow [skip ci]'
          git push origin main
