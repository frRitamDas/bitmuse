name: Repair brand-channel revert

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'Repair brand-channel revert') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Revert the incomplete brand-channel revert
        run: git revert -X theirs --no-edit e5b20928c629bef0e2a2b4952fb112e17bd1c722
      - name: Push repair commit
        run: git push origin HEAD:main
