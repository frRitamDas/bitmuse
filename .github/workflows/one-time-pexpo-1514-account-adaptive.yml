on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply v1.5.1.4 account adaptive fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

