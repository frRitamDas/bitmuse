/** Highly sensitive, opt-in compatibility control. */
@Composable
fun AdaptiveDisplayCompatibilitySetting() {
    val enabled by AppSettings.adaptiveDisplayCompatibility.collectAsStateWithLifecycle()
    val configuration = LocalConfiguration.current
    val density = LocalDensity.current
    val shape = RoundedCornerShape(18.dp)
    val red = Color(0xFFB71C1C)
    val redContainer = Color(0xFF3A1010)
    Column(
        modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 8.dp)
            .background(redContainer, shape).padding(14.dp),
    ) {
        Row(verticalAlignment = Alignment.CenterVertically) {
            Icon(Icons.Rounded.Warning, null, tint = red, modifier = Modifier.size(24.dp))
            Column(Modifier.weight(1f).padding(start = 10.dp)) {
                Text("Adaptive Display Compatibility", style = MaterialTheme.typography.titleMedium, color = Color.White)
                Text("Automatically adapts the interface when your device clips or misplaces UI.",
                    style = MaterialTheme.typography.bodySmall, color = Color.White.copy(alpha = .72f))
            }
            Switch(checked = enabled, onCheckedChange = { AppSettings.adaptiveDisplayCompatibility.value = it })
        }
        Text("CAUTION — USE ONLY IF YOU HAVE A DISPLAY OR LAYOUT PROBLEM",
            style = MaterialTheme.typography.labelSmall, color = red, modifier = Modifier.padding(top = 12.dp))
        Text("Do not enable unnecessarily. Pexpo keeps its normal sizing when the environment is already fitting correctly.",
            style = MaterialTheme.typography.bodySmall, color = Color.White.copy(alpha = .66f), modifier = Modifier.padding(top = 4.dp))
        if (enabled) {
            Text("Compatibility mode is active. Layouts may reflow and typography may scale down only when the available environment requires it.",
                style = MaterialTheme.typography.bodySmall, color = Color.White.copy(alpha = .82f), modifier = Modifier.padding(top = 8.dp))
        }
    }
}

/** Applies conservative environment-aware scaling only when compatibility mode is enabled. */
@Composable
fun AdaptiveDisplayCompatibility(content: @Composable () -> Unit) {
    val enabled by AppSettings.adaptiveDisplayCompatibility.collectAsStateWithLifecycle()
    val base = LocalDensity.current
    val config = LocalConfiguration.current
    val scale = if (!enabled) 1f else when {
        config.screenWidthDp < 360 -> .90f
        base.fontScale > 1.20f -> (1.05f / base.fontScale).coerceIn(.86f, 1f)
        else -> 1f
    }
    CompositionLocalProvider(LocalDensity provides Density(base.density * scale, base.fontScale * scale), content = content)
}
