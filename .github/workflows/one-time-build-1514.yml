name: One-time Pexpo v1.5.1.4 build

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pexpo-1514-verification
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Pexpo v1.5.1.4
        run: ./gradlew assembleProdRelease --stacktrace

      - name: Verify APKs
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/prod/release/app-prod-universal-release.apk
          test -s app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk
          test -s app/build/outputs/apk/prod/release/app-prod-armeabi-v7a-release.apk
          test -s app/build/outputs/apk/prod/release/app-prod-x86_64-release.apk
          ls -lh app/build/outputs/apk/prod/release/*.apk

      - name: Upload verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: pexpo-v1.5.1.4-release-verified
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
