name: Pexpo Windows

on:
  push:
    branches: [pc-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Pexpo 1.1 Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Pexpo 1.1 installer
        shell: pwsh
        run: |
          $installer = Join-Path $PWD 'dist\Pexpo-1.1-Setup.exe'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            Write-Host 'Files produced in dist:'
            Get-ChildItem -Path dist -File | Select-Object Name, Length
            throw 'Pexpo 1.1 Windows installer was not produced at the expected path.'
          }

          $size = (Get-Item -LiteralPath $installer).Length
          if ($size -lt 1048576) {
            throw "Installer is unexpectedly small: $size bytes."
          }

          Write-Host "Created: $installer"
          Write-Host "Size: $size bytes"
          Get-FileHash -LiteralPath $installer -Algorithm SHA256

      - name: Upload Pexpo 1.1 installer
        uses: actions/upload-artifact@v4
        with:
          name: pexpo-windows-1.1
          path: windows/dist/Pexpo-1.1-Setup.exe
          if-no-files-found: error
          retention-days: 30
