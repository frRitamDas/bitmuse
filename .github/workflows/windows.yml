name: Pexpo Windows

on:
  push:
    branches: [pc-windows]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Pexpo Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'Pexpo-1.1-Setup.exe' -File
          if (-not $installer) { throw 'Pexpo Windows installer was not produced.' }
          Write-Host "Created $($installer.FullName)"
          Get-FileHash $installer.FullName -Algorithm SHA256

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: pexpo-windows-1.1
          path: windows/dist/Pexpo-1.1-Setup.exe
          if-no-files-found: error
          retention-days: 30
