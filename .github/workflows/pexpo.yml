name: Pexpo Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pexpo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Configure Last.fm test credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
      - name: Apply and verify 1.5.7 compatibility patch
        run: python3 scripts/patch_157.py
      - name: Verify no Java stream source calls remain
        run: |
          set -euo pipefail
          if git grep -n -E 'streamAsJsonObjects|\.stream[[:space:]]*\(' -- 'app/src/**/*.kt' 'app/src/**/*.java'; then
            echo 'Unsafe Java stream usage remains in app/src.' >&2
            exit 1
          fi
      - name: Build and test Dev Debug
        run: ./gradlew clean testDevDebugUnitTest assembleDevDebug --stacktrace
      - name: Upload PR APK
        uses: actions/upload-artifact@v4
        with:
          name: pexpo-1.5.7-pr-debug
          path: app/build/outputs/apk/dev/debug/*.apk

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Configure Last.fm production credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          set -euo pipefail
          test -n "$LASTFM_API_KEY" || { echo 'Missing LASTFM_API_KEY.' >&2; exit 1; }
          test -n "$LASTFM_SECRET" || { echo 'Missing LASTFM_SECRET.' >&2; exit 1; }
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
      - name: Apply and verify 1.5.7 compatibility patch
        run: python3 scripts/patch_157.py
      - name: Verify source contains no Java stream calls
        run: |
          set -euo pipefail
          if git grep -n -E 'streamAsJsonObjects|\.stream[[:space:]]*\(' -- 'app/src/**/*.kt' 'app/src/**/*.java'; then
            echo 'Unsafe Java stream usage remains in app/src.' >&2
            exit 1
          fi
      - name: Setup permanent Pexpo release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing required signing secret: $name" >&2; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > pexpo-release.jks
          keytool -list -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo 'storeFile=pexpo-release.jks'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
      - name: Resolve Android signing tools
        id: signing-tools
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          test -x "$APKSIGNER" && test -x "$AAPT" && test -x "$ZIPALIGN"
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"
          echo "aapt=$AAPT" >> "$GITHUB_OUTPUT"
          echo "zipalign=$ZIPALIGN" >> "$GITHUB_OUTPUT"
      - name: Verify upgrade signing continuity against v1.5.5
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-release
          gh release download v1.5.5 --repo "$GITHUB_REPOSITORY" --pattern 'pexpo-1.5.5-universal.apk' --dir /tmp/previous-release
          PERMANENT_FP=$(keytool -list -v -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d '[:space:]')
          PREVIOUS_FP=$(${{ steps.signing-tools.outputs.apksigner }} verify --print-certs /tmp/previous-release/pexpo-1.5.5-universal.apk | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d '[:space:]')
          test -n "$PERMANENT_FP" && test -n "$PREVIOUS_FP"
          if [ "$PERMANENT_FP" != "$PREVIOUS_FP" ]; then
            echo 'FATAL: permanent Pexpo keystore does not match the certificate used by v1.5.5.' >&2
            exit 1
          fi
          echo "Signing continuity verified: $PERMANENT_FP"
      - name: Clean build and run production unit tests
        run: ./gradlew clean testProdReleaseUnitTest assembleProdRelease --stacktrace
      - name: Re-sign and verify every production APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER='${{ steps.signing-tools.outputs.apksigner }}'
          for apk in app/build/outputs/apk/prod/release/*.apk; do
            [ -f "$apk" ] || continue
            "$APKSIGNER" sign --ks pexpo-release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" "$apk"
            "$APKSIGNER" verify -Werr "$apk"
          done
      - name: Verify final production identity and signing certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          APKSIGNER='${{ steps.signing-tools.outputs.apksigner }}'
          AAPT='${{ steps.signing-tools.outputs.aapt }}'
          EXPECTED_FP=$(keytool -list -v -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d '[:space:]')
          for apk in app/build/outputs/apk/prod/release/*.apk; do
            [ -f "$apk" ] || continue
            BADGING=$("$AAPT" dump badging "$apk")
            echo "$BADGING" | grep -F "package: name='com.music.pexpo'" >/dev/null
            echo "$BADGING" | grep -F "versionName='1.5.7'" >/dev/null
            echo "$BADGING" | grep -F "sdkVersion:'21'" >/dev/null
            echo "$BADGING" | grep -F "targetSdkVersion:'35'" >/dev/null
            ACTUAL_FP=$("$APKSIGNER" verify --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d '[:space:]')
            [ "$ACTUAL_FP" = "$EXPECTED_FP" ] || { echo "Certificate mismatch in $apk" >&2; exit 1; }
          done
      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk release-assets/pexpo-1.5.7-universal.apk
          cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk release-assets/pexpo-1.5.7-arm64-v8a.apk
          cp app/build/outputs/apk/prod/release/app-prod-armeabi-v7a-release.apk release-assets/pexpo-1.5.7-armeabi-v7a.apk
          cp app/build/outputs/apk/prod/release/app-prod-x86_64-release.apk release-assets/pexpo-1.5.7-x86_64.apk
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
      - name: Finalize patched source on main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src app/build.gradle.kts scripts settings.gradle.kts .github/workflows/pexpo.yml README.md
          if git diff --cached --quiet; then
            echo 'No source finalization commit required.'
          else
            git commit -m 'fix: finalize Pexpo 1.5.7 universal playback release'
            git push origin HEAD:main
          fi
      - name: Upload Pexpo 1.5.7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pexpo-v1.5.7-release
          path: release-assets/*
      - name: Publish GitHub Release v1.5.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          Pexpo Music v1.5.7 — Universal Playback & Stability

          ### Playback
          - Fixed the universal NanoJSON/NewPipeExtractor binary mismatch that caused `NoSuchMethodError: streamAsJsonObjects()` and left tracks buffering indefinitely.
          - Pinned NanoJSON to the exact upstream version required by the bundled NewPipeExtractor.
          - Enabled core-library desugaring and Java 8 bytecode compatibility for Java stream APIs on older Android releases.
          - Removed Java stream usage from the vendored NewPipe utility layer and added source verification so it cannot silently return.
          - Kept the player-client retry path ahead of extraction and made the production extractor path deterministic.

          ### Account experience
          - Fixed stale account-selector avatars when Google changes the image behind the same avatar URL.
          - Preserved multi-account sessions, switching, and fresh Add Account authentication.

          ### Compatibility
          - Android minSdk 21, compileSdk 35, targetSdk 35.
          - Production identity remains `com.music.pexpo`, so v1.5.7 is an in-place update for v1.5.6.
          - All production APKs are verified against the same permanent signing certificate used by v1.5.5.

          ### Downloads
          Universal, arm64-v8a, armeabi-v7a and x86_64 APKs are attached, with SHA-256 checksums.
          EOF
          )
          if gh release view v1.5.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.5.7 --repo "$GITHUB_REPOSITORY" --title 'Pexpo Music v1.5.7 — Universal Playback & Stability' --notes "$NOTES" --target main
          else
            gh release create v1.5.7 --repo "$GITHUB_REPOSITORY" --target main --title 'Pexpo Music v1.5.7 — Universal Playback & Stability' --notes "$NOTES"
          fi
          gh release upload v1.5.7 --repo "$GITHUB_REPOSITORY" --clobber release-assets/*
      - name: Clean obsolete Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name != "pexpo-v1.5.7-release") | .id' | while read -r id; do
            [ -z "$id" ] || gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
          done
