name: Pexpo Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pexpo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Configure test credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
      - name: Apply 1.5.7 patch and static compatibility checks
        run: python3 scripts/patch_157.py
      - name: Build and test
        run: ./gradlew clean testDevDebugUnitTest assembleDevDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pexpo-1.5.7-pr-debug
          path: app/build/outputs/apk/dev/debug/*.apk

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Configure production credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          set -euo pipefail
          test -n "$LASTFM_API_KEY" && test -n "$LASTFM_SECRET"
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
      - name: Apply 1.5.7 patch and static compatibility checks
        run: python3 scripts/patch_157.py
      - name: Setup permanent signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do test -n "${!name}"; done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > pexpo-release.jks
          keytool -list -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          printf 'storeFile=pexpo-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Resolve signing tools
        id: tools
        run: |
          set -euo pipefail
          echo "apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
          echo "aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Verify signing continuity against v1.5.5
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/old
          gh release download v1.5.5 --repo "$GITHUB_REPOSITORY" -p 'pexpo-1.5.5-universal.apk' -D /tmp/old
          keyfp=$(keytool -list -v -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d '[:space:]')
          oldfp=$(${{ steps.tools.outputs.apksigner }} verify --print-certs /tmp/old/pexpo-1.5.5-universal.apk | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d '[:space:]')
          test -n "$keyfp" && test "$keyfp" = "$oldfp"
      - name: Clean build and unit tests
        run: ./gradlew clean testProdReleaseUnitTest assembleProdRelease --stacktrace
      - name: Sign and verify all APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signer='${{ steps.tools.outputs.apksigner }}'
          for apk in app/build/outputs/apk/prod/release/*.apk; do
            [ -f "$apk" ] || continue
            "$signer" sign --ks pexpo-release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" "$apk"
            "$signer" verify -Werr "$apk"
          done
      - name: Verify final identity
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          aapt='${{ steps.tools.outputs.aapt }}'
          signer='${{ steps.tools.outputs.apksigner }}'
          expected=$(keytool -list -v -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d '[:space:]')
          for apk in app/build/outputs/apk/prod/release/*.apk; do
            [ -f "$apk" ] || continue
            badging=$("$aapt" dump badging "$apk")
            echo "$badging" | grep -F "package: name='com.music.pexpo'" >/dev/null
            echo "$badging" | grep -F "versionName='1.5.7'" >/dev/null
            echo "$badging" | grep -F "sdkVersion:'21'" >/dev/null
            echo "$badging" | grep -F "targetSdkVersion:'35'" >/dev/null
            actual=$("$signer" verify --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d '[:space:]')
            test "$actual" = "$expected"
          done
      - name: Prepare assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk release-assets/pexpo-1.5.7-universal.apk
          cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk release-assets/pexpo-1.5.7-arm64-v8a.apk
          cp app/build/outputs/apk/prod/release/app-prod-armeabi-v7a-release.apk release-assets/pexpo-1.5.7-armeabi-v7a.apk
          cp app/build/outputs/apk/prod/release/app-prod-x86_64-release.apk release-assets/pexpo-1.5.7-x86_64.apk
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
      - name: Finalize source before release tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src app/build.gradle.kts scripts settings.gradle.kts .github/workflows/pexpo.yml README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: finalize Pexpo 1.5.7 universal playback release'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: pexpo-v1.5.7-release
          path: release-assets/*
      - name: Publish v1.5.7 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.5.7 --repo "$GITHUB_REPOSITORY" --target main --latest --title 'Pexpo Music v1.5.7 — Universal Playback & Stability' --notes-file <(cat <<'EOF'
          ## Pexpo Music v1.5.7

          ### Playback
          - Fixed the NanoJSON/NewPipeExtractor binary mismatch that caused `NoSuchMethodError: streamAsJsonObjects()` and endless buffering.
          - Pinned NanoJSON to the exact upstream dependency required by the bundled extractor.
          - Enabled Java 8 core-library desugaring for older Android versions.
          - Removed Java stream usage from the vendored NewPipe utility source.
          - Added a JVM regression test for the extractor/NanoJSON method contract.

          ### UX
          - Fixed stale Google avatar images in the account selector.
          - Preserved multi-account switching and fresh Add Account authentication.

          ### Compatibility
          - minSdk 21 / compileSdk 35 / targetSdk 35.
          - `com.music.pexpo` identity is unchanged, so v1.5.7 updates v1.5.6 in place.
          - Production signing is verified against the v1.5.5 certificate before publication.

          Universal, arm64-v8a, armeabi-v7a and x86_64 APKs plus SHA-256 checksums are attached.
          EOF
          ) release-assets/*
