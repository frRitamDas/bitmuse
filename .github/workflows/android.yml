name: Android CI

on: [push, pull_request]

jobs:
  build-dev-debug:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup local.properties
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      run: |
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Dev Debug APK
      run: ./gradlew assembleDevDebug
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk

  build-prod-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Secrets (Keystore & local.properties)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail

        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties

        valid_keystore=false
        if [ -n "$KEYSTORE_BASE64" ]; then
          if printf '%s' "$KEYSTORE_BASE64" | base64 --decode > bitchord-release.jks 2>/dev/null; then
            if [ -s bitchord-release.jks ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
              if keytool -list -keystore bitchord-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 && \
                 keytool -list -keystore bitchord-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
                valid_keystore=true
              fi
            fi
          fi
        fi

        if [ "$valid_keystore" = true ]; then
          echo 'Using configured release keystore.'
          {
            echo 'storeFile=bitchord-release.jks'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
        else
          echo 'Configured release keystore is unavailable or invalid; generating a temporary CI signing key.'
          rm -f bitchord-release.jks
          CI_STORE_PASSWORD="$(openssl rand -hex 32)"
          CI_KEY_PASSWORD="$CI_STORE_PASSWORD"
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore bitchord-release.jks \
            -alias bitchord-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$CI_STORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -dname 'CN=BitChord CI, O=BitChord, C=IN' >/dev/null
          {
            echo 'storeFile=bitchord-release.jks'
            printf 'storePassword=%s\n' "$CI_STORE_PASSWORD"
            echo 'keyAlias=bitchord-ci'
            printf 'keyPassword=%s\n' "$CI_KEY_PASSWORD"
          } > keystore.properties
        fi
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease --stacktrace
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk
