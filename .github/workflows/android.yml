name: Android CI

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build-dev-debug:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup local.properties
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      run: |
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Dev Debug APK
      run: ./gradlew assembleDevDebug
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk

  build-prod-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name: Apply Pexpo branding and account-menu fixes
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re
        
        root = Path('.')
        changed = []
        
        # User-facing branding and exported media paths. Do not touch the
        # Kotlin package namespace/applicationId: those are compatibility IDs.
        for p in root.glob('app/src/main/res/**/strings.xml'):
            s = p.read_text(encoding='utf-8')
            n = s.replace('BitChord', 'Pexpo').replace('bitchord', 'Pexpo').replace('Music/Pexpo', 'Music/Pexpo')
            if n != s:
                p.write_text(n, encoding='utf-8')
                changed.append(str(p))
        
        # Replace old user-visible Music/BitChord references everywhere in app source.
        for p in root.glob('app/src/main/java/**/*.kt'):
            s = p.read_text(encoding='utf-8')
            n = s.replace('Music/BitChord', 'Music/Pexpo')
            if n != s:
                p.write_text(n, encoding='utf-8')
                changed.append(str(p))
        
        # The download folder is a user-visible part of the app identity. Keep
        # existing Music/BitChord files discoverable while new downloads use Pexpo.
        dp = root / 'app/src/main/java/com/music/bitchord/download/DownloadStore.kt'
        if dp.exists():
            s = dp.read_text(encoding='utf-8')
            n = s.replace('const val FOLDER = "BitChord"', 'const val FOLDER = "Pexpo"')
            if n != s:
                dp.write_text(n, encoding='utf-8')
                changed.append(str(dp))
        
        # Make the top account avatar a real account menu. It uses the existing
        # MainViewModel session source of truth, so account/profile changes stay
        # synchronized with playback and authentication state.
        fp = root / 'app/src/main/java/com/music/bitchord/ui/components/FrostedTopBar.kt'
        s = fp.read_text(encoding='utf-8')
        start = s.find('@Composable\nfun TopBarAccountButton(')
        if start < 0:
            raise SystemExit('TopBarAccountButton marker not found')
        end = s.find('\n/**', start + 10)
        if end < 0:
            raise SystemExit('TopBarAccountButton end marker not found')
        new_fn = '''@Composable
fun TopBarAccountButton(
    account: Account?,
    onClick: () -> Unit,
    onSwipeProfile: (Boolean) -> Unit = {},
    modifier: Modifier = Modifier,
    onAddAccount: (() -> Unit)? = null,
    onOpenSettings: (() -> Unit)? = null,
) {
    val viewModel: MainViewModel = viewModel()
    val accounts by viewModel.googleAccounts.collectAsStateWithLifecycle()
    val activeAccountId by viewModel.activeAccountId.collectAsStateWithLifecycle()
    val activeProfileId by viewModel.activeProfileId.collectAsStateWithLifecycle()
    var expanded by remember { mutableStateOf(false) }
    var managing by remember { mutableStateOf(false) }

    Box(modifier = modifier) {
        IconButton(
            onClick = { expanded = !expanded },
            modifier = Modifier
                .clip(CircleShape)
                .pointerInput(Unit) {
                    detectHorizontalDragGestures(
                        onHorizontalDrag = { _, dragAmount ->
                            if (kotlin.math.abs(dragAmount) > 14f) {
                                onSwipeProfile(dragAmount < 0f)
                            }
                        },
                    )
                },
        ) {
            if (account?.thumbnailUrl != null) {
                AsyncImage(
                    model = account.thumbnailUrl,
                    contentDescription = account.name,
                    modifier = Modifier
                        .fillMaxSize()
                        .clip(CircleShape),
                    contentScale = ContentScale.Crop,
                )
            } else {
                Surface(
                    modifier = Modifier.fillMaxSize(),
                    shape = CircleShape,
                    color = MaterialTheme.colorScheme.primaryContainer,
                ) {
                    Box(contentAlignment = Alignment.Center) {
                        Icon(
                            imageVector = Icons.Rounded.Person,
                            contentDescription = account?.name ?: "Account",
                            tint = MaterialTheme.colorScheme.onPrimaryContainer,
                        )
                    }
                }
            }
        }

        DropdownMenu(
            expanded = expanded,
            onDismissRequest = { expanded = false; managing = false },
            modifier = Modifier.widthIn(min = 260.dp, max = 340.dp),
        ) {
            Text(
                text = account?.name ?: "Pexpo account",
                style = MaterialTheme.typography.titleMedium,
                modifier = Modifier.padding(horizontal = 20.dp, vertical = 10.dp),
            )

            if (accounts.isEmpty()) {
                DropdownMenuItem(
                    text = { Text("Sign in to an account") },
                    onClick = {
                        expanded = false
                        onAddAccount?.invoke() ?: onClick()
                    },
                    leadingIcon = { Icon(Icons.Rounded.PersonAdd, null) },
                )
            } else {
                accounts.forEach { googleAccount ->
                    if (managing) {
                        DropdownMenuItem(
                            text = {
                                Text(
                                    if (googleAccount.accountId == activeAccountId) "${googleAccount.name} (current)" else googleAccount.name
                                )
                            },
                            onClick = {
                                viewModel.removeAccount(googleAccount.accountId)
                                managing = false
                                expanded = false
                            },
                            leadingIcon = { Icon(Icons.Rounded.DeleteOutline, null) },
                        )
                    } else {
                        DropdownMenuItem(
                            text = { Text(googleAccount.name) },
                            onClick = {
                                val profile = googleAccount.profiles.firstOrNull { it.profileId == activeProfileId }
                                    ?: googleAccount.profiles.firstOrNull()
                                if (profile != null) {
                                    viewModel.selectProfile(googleAccount.accountId, profile.profileId, profile)
                                }
                                expanded = false
                            },
                            leadingIcon = { Icon(Icons.Rounded.AccountCircle, null) },
                        )
                    }
                }
            }

            HorizontalDivider()
            DropdownMenuItem(
                text = { Text(if (managing) "Done" else "Manage accounts") },
                onClick = { managing = !managing },
                leadingIcon = { Icon(Icons.Rounded.ManageAccounts, null) },
            )
            DropdownMenuItem(
                text = { Text("Add account") },
                onClick = {
                    expanded = false
                    onAddAccount?.invoke() ?: onClick()
                },
                leadingIcon = { Icon(Icons.Rounded.PersonAdd, null) },
            )
            DropdownMenuItem(
                text = { Text("Settings") },
                onClick = {
                    expanded = false
                    onOpenSettings?.invoke() ?: onClick()
                },
                leadingIcon = { Icon(Icons.Rounded.Settings, null) },
            )
        }
    }
}
'''
        s = s[:start] + new_fn + s[end:]
        imports = {
            'import androidx.compose.material3.DropdownMenu\n': 'import androidx.compose.material3.DropdownMenu\n',
        }
        required = [
            'import androidx.compose.material3.DropdownMenu',
            'import androidx.compose.material3.DropdownMenuItem',
            'import androidx.compose.material3.HorizontalDivider',
            'import androidx.lifecycle.compose.collectAsStateWithLifecycle',
            'import androidx.lifecycle.viewmodel.compose.viewModel',
            'import androidx.compose.runtime.setValue',
            'import androidx.compose.runtime.mutableStateOf',
            'import com.music.bitchord.ui.MainViewModel',
        ]
        for imp in required:
            if imp not in s:
                anchor = 'import '
                pos = s.find(anchor)
                # Put imports at the top after package line; stable and idempotent.
                package_end = s.find('\n', s.find('package ')) + 1
                s = s[:package_end] + imp + '\n' + s[package_end:]
        fp.write_text(s, encoding='utf-8')
        changed.append(str(fp))
        
        # Wire Add account and Settings to the actual host UI states.
        mp = root / 'app/src/main/java/com/music/bitchord/MainActivity.kt'
        ms = mp.read_text(encoding='utf-8')
        old = '''onClick = {
                            if (signedIn) {
                                showAccountSelector = true
                            } else {
                                showSettings = true
                            }
                        },'''
        new = '''onClick = { showSettings = true },
                        onAddAccount = { webSession = WebSessionMode.SIGN_IN },
                        onOpenSettings = { showSettings = true },'''
        if old in ms:
            ms = ms.replace(old, new, 1)
        else:
            raise SystemExit('signed-in account button callback marker not found')
        mp.write_text(ms, encoding='utf-8')
        changed.append(str(mp))
        
        # Make the release app's internal branding consistent without changing
        # the stable package/application id used for upgrades.
        ap = root / 'app/src/main/java/com/music/bitchord/BitChordApplication.kt'
        if ap.exists():
            s = ap.read_text(encoding='utf-8')
            n = s.replace('class BitChordApplication', 'class PexpoApplication')
            if n != s:
                ap.write_text(n, encoding='utf-8')
                changed.append(str(ap))
                manifest = root / 'app/src/main/AndroidManifest.xml'
                if manifest.exists():
                    m = manifest.read_text(encoding='utf-8')
                    nm = m.replace('.BitChordApplication', '.PexpoApplication')
                    if nm != m:
                        manifest.write_text(nm, encoding='utf-8')
                        changed.append(str(manifest))
        
        # Keep Replay explicitly outside authentication lifecycle. The existing
        # listener store is device-local; this marker prevents future auth work
        # from accidentally treating it as account state.
        sp = root / 'app/src/main/java/com/music/bitchord/data/stats/ListeningStats.kt'
        s = sp.read_text(encoding='utf-8')
        marker = '    private const val DIRECTORY = "listening"'
        if marker in s and 'Authentication must never clear this directory' not in s:
            s = s.replace(marker, '    // Authentication must never clear this directory; Replay belongs to the device.\n' + marker)
            sp.write_text(s, encoding='utf-8')
            changed.append(str(sp))
        
        print('Patched files:', *sorted(set(changed)), sep='\n  ')
        PY
        git status --short
        if git diff --quiet; then
          echo 'No source patch was necessary.'
        else
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main
          git commit -m 'Fix Pexpo branding and account menu'
          git push
        fi
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Secrets (Keystore & local.properties)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
        valid_keystore=false
        if [ -n "$KEYSTORE_BASE64" ]; then
          if printf '%s' "$KEYSTORE_BASE64" | base64 --decode > bitchord-release.jks 2>/dev/null; then
            if [ -s bitchord-release.jks ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
              if keytool -list -keystore bitchord-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 && \
                 keytool -list -keystore bitchord-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
                valid_keystore=true
              fi
            fi
          fi
        fi
        if [ "$valid_keystore" = true ]; then
          echo 'Using configured release keystore.'
          {
            echo 'storeFile=bitchord-release.jks'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
        else
          echo 'Configured release keystore is unavailable or invalid; generating a temporary CI signing key.'
          rm -f bitchord-release.jks
          CI_STORE_PASSWORD="$(openssl rand -hex 32)"
          CI_KEY_PASSWORD="$CI_STORE_PASSWORD"
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore bitchord-release.jks \
            -alias bitchord-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$CI_STORE_PASSWORD" \
            -keypass "$CI_KEY_PASSWORD" \
            -dname 'CN=Pexpo CI, O=Pexpo, C=IN' >/dev/null
          {
            echo 'storeFile=bitchord-release.jks'
            printf 'storePassword=%s\n' "$CI_STORE_PASSWORD"
            echo 'keyAlias=bitchord-ci'
            printf 'keyPassword=%s\n' "$CI_KEY_PASSWORD"
          } > keystore.properties
        fi
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease --stacktrace
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk
