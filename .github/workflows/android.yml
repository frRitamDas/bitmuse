name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pexpo-android-${{ github.ref }}-${{ github.workflow_sha }}
  cancel-in-progress: true

jobs:
  build-dev-debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup local.properties
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      run: |
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
    - name: Apply Pexpo maintenance patches
      run: |
        python3 scripts/patch_155.py
        python3 scripts/patch_156.py
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Dev Debug APK
      run: ./gradlew assembleDevDebug --stacktrace
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pexpo-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk

  build-prod-release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Validate and setup Last.fm credentials
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      run: |
        set -euo pipefail
        if [ -z "$LASTFM_API_KEY" ] || [ -z "$LASTFM_SECRET" ]; then
          echo 'LASTFM_API_KEY and LASTFM_SECRET repository Actions secrets are required for the production release.' >&2
          exit 1
        fi
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
    - name: Apply Pexpo 1.5.6 maintenance patches
      run: |
        python3 scripts/patch_155.py
        python3 scripts/patch_156.py
    - name: Setup permanent release signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          if [ -z "${!name}" ]; then
            echo "Missing required Actions secret: $name" >&2
            exit 1
          fi
        done
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > pexpo-release.jks
        [ -s pexpo-release.jks ]
        keytool -list -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null
        keytool -list -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
        {
          echo 'storeFile=pexpo-release.jks'
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
          printf 'keyAlias=%s\n' "$KEY_ALIAS"
          printf 'keyPassword=%s\n' "$KEY_PASSWORD"
        } > keystore.properties
        echo 'Permanent Pexpo release keystore validated and selected.'
    - name: Verify permanent key is the same identity used by Pexpo 1.5.5
      env:
        GH_TOKEN: ${{ github.token }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        set -euo pipefail
        export LC_ALL=C
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
        [ -x "$APKSIGNER" ]
        mkdir -p signing-baseline
        gh release download v1.5.5 --repo "$GITHUB_REPOSITORY" --pattern 'pexpo-1.5.5-universal.apk' --dir signing-baseline --clobber
        BASELINE=signing-baseline/pexpo-1.5.5-universal.apk
        [ -s "$BASELINE" ]
        keytool -exportcert -rfc -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > expected-cert.pem
        EXPECTED=$(openssl x509 -in expected-cert.pem -noout -fingerprint -sha256 | sed 's/.*=//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
        BASELINE_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$BASELINE" 2>&1)
        printf '%s\n' "$BASELINE_OUTPUT" > baseline-cert.txt
        echo "$BASELINE_OUTPUT"
        BASELINE_CERT=$(printf '%s\n' "$BASELINE_OUTPUT" | grep -m1 'certificate SHA-256 digest:' | sed 's/.*: *//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
        [ "${#EXPECTED}" -eq 64 ]
        [ "${#BASELINE_CERT}" -eq 64 ]
        echo "Permanent keystore SHA-256: $EXPECTED"
        echo "Pexpo 1.5.5 SHA-256:        $BASELINE_CERT"
        if [ "$EXPECTED" != "$BASELINE_CERT" ]; then
          echo 'FATAL: the configured KEYSTORE_BASE64 is NOT the certificate that signed Pexpo 1.5.5.' >&2
          echo 'Do not publish 1.5.6. Restore the original permanent Pexpo signing secrets before retrying.' >&2
          exit 1
        fi
        echo 'Verified: the configured permanent keystore matches the Pexpo 1.5.5 signing identity.'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Pexpo v1.5.6
      run: ./gradlew assembleProdRelease --stacktrace
    - name: Verify Pexpo release identity
      run: |
        set -euo pipefail
        APK=app/build/outputs/apk/prod/release/app-prod-universal-release.apk
        [ -s "$APK" ]
        AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
        BADGING=$("$AAPT" dump badging "$APK")
        echo "$BADGING" | grep -F "package: name='com.music.pexpo'" >/dev/null
        echo "$BADGING" | grep -F "versionCode='20'" >/dev/null
        echo "$BADGING" | grep -F "versionName='1.5.6'" >/dev/null
        echo 'Verified production APK identity: com.music.pexpo v1.5.6 (versionCode 20)'
    - name: Force production APKs to the permanent Pexpo certificate
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
        [ -x "$APKSIGNER" ]
        for APK in app/build/outputs/apk/prod/release/*.apk; do
          [ -s "$APK" ] || continue
          TMP="${APK}.signed"
          "$APKSIGNER" sign \
            --ks pexpo-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$TMP" "$APK"
          mv "$TMP" "$APK"
        done
        echo 'All production APKs were explicitly signed with the permanent Pexpo release keystore.'
    - name: Verify release certificate and upgrade identity
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        set -euo pipefail
        export LC_ALL=C
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
        keytool -exportcert -rfc -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > expected-cert.pem
        EXPECTED=$(openssl x509 -in expected-cert.pem -noout -fingerprint -sha256 | sed 's/.*=//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
        [ "${#EXPECTED}" -eq 64 ]
        for APK in app/build/outputs/apk/prod/release/*.apk; do
          [ -s "$APK" ] || continue
          OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)
          printf '%s\n' "$OUTPUT"
          echo "$OUTPUT" | grep -F 'Verifies' >/dev/null
          ACTUAL=$(printf '%s\n' "$OUTPUT" | grep -m1 'certificate SHA-256 digest:' | sed 's/.*: *//' | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
          [ "${#ACTUAL}" -eq 64 ]
          echo "$(basename "$APK") -> $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ]
        done
        echo 'Verified: every Pexpo 1.5.6 production APK uses the permanent certificate that also signed 1.5.5.'
    - name: Prepare release assets
      run: |
        set -euo pipefail
        mkdir -p release-assets
        cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk release-assets/pexpo-1.5.6-universal.apk
        cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk release-assets/pexpo-1.5.6-arm64-v8a.apk
        cp app/build/outputs/apk/prod/release/app-prod-armeabi-v7a-release.apk release-assets/pexpo-1.5.6-armeabi-v7a.apk
        cp app/build/outputs/apk/prod/release/app-prod-x86_64-release.apk release-assets/pexpo-1.5.6-x86_64.apk
        sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
    - name: Upload Pexpo 1.5.6 artifact
      uses: actions/upload-artifact@v4
      with:
        name: pexpo-v1.5.6-release
        path: release-assets/*
    - name: Publish GitHub Release v1.5.6
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        NOTES=$(cat <<'EOF'
        Pexpo Music v1.5.6

        ## ✨ What's new

        ### 👥 Multiple Google Accounts
        - Add and keep multiple independent Google / YouTube Music sessions in Pexpo.
        - Use **Add account** to sign in to another Google account without replacing the existing session.
        - Switch instantly between saved accounts and their Personal / Brand profiles.
        - Each account keeps its own authenticated session and profile state.
        - Manage and remove accounts directly from the account selector.

        ### 📴 A smoother offline Home
        - When Pexpo has no active network, Home now reuses its existing polished skeleton cards instead of abruptly showing a full **No Internet Connection** error state.
        - The existing Pexpo skeleton design is reused; no duplicate loading UI was introduced.
        - Normal network errors still retain the existing retry message when a connection is available.

        ### 🔐 Production & updates
        - Version **1.5.6** is signed with exactly the same permanent Pexpo certificate as 1.5.5, preserving the Android upgrade path.
        - Production package remains `com.music.pexpo`.
        - CI verifies the 1.5.5 baseline certificate before building, explicitly signs every 1.5.6 APK, and verifies every final APK before publication.
        - Universal, arm64-v8a, armeabi-v7a and x86_64 APKs are provided with SHA-256 checksums.

        ## 🚀 Upgrade

        Pexpo 1.5.6 is a focused release: multi-account support and a more graceful offline Home experience, with the stable 1.5.5 production behavior preserved.
        EOF
        )
        if gh release view v1.5.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release edit v1.5.6 --repo "$GITHUB_REPOSITORY" --title 'Pexpo Music v1.5.6' --notes "$NOTES"
        else
          gh release create v1.5.6 --repo "$GITHUB_REPOSITORY" --target main --title 'Pexpo Music v1.5.6' --notes "$NOTES"
        fi
        gh release upload v1.5.6 \
          --repo "$GITHUB_REPOSITORY" \
          --clobber \
          release-assets/pexpo-1.5.6-universal.apk \
          release-assets/pexpo-1.5.6-arm64-v8a.apk \
          release-assets/pexpo-1.5.6-armeabi-v7a.apk \
          release-assets/pexpo-1.5.6-x86_64.apk \
          release-assets/SHA256SUMS.txt
    - name: Remove superseded Actions artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name != "pexpo-v1.5.6-release") | .id' | while read -r id; do
          [ -z "$id" ] || gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
        done
    - name: Finalize patched source
      if: success()
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add app/src app/build.gradle.kts scripts README.md
        if git diff --cached --quiet; then echo 'Source already finalized.'; exit 0; fi
        git commit -m 'fix: finalize Pexpo 1.5.6 release patches'
        git push origin main
