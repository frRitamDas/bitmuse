name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  actions: write

concurrency:
  group: pexpo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev-debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup local.properties
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      run: |
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Dev Debug APK
      run: ./gradlew assembleDevDebug --stacktrace
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pexpo-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk

  build-prod-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup local.properties
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      run: |
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
    - name: Setup release signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        valid_keystore=false
        if [ -n "$KEYSTORE_BASE64" ]; then
          if printf '%s' "$KEYSTORE_BASE64" | base64 --decode > bitchord-release.jks 2>/dev/null; then
            if [ -s bitchord-release.jks ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
              if keytool -list -keystore bitchord-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 && \
                 keytool -list -keystore bitchord-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
                valid_keystore=true
              fi
            fi
          fi
        fi
        if [ "$valid_keystore" = true ]; then
          echo 'Using configured release keystore.'
          {
            echo 'storeFile=bitchord-release.jks'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
        else
          echo 'Configured release keystore unavailable; using temporary CI signing key for this build.'
          rm -f bitchord-release.jks
          CI_STORE_PASSWORD="$(openssl rand -hex 32)"
          keytool -genkeypair -v -storetype JKS \
            -keystore bitchord-release.jks \
            -alias bitchord-ci -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$CI_STORE_PASSWORD" -keypass "$CI_STORE_PASSWORD" \
            -dname 'CN=Pexpo CI, O=Pexpo, C=IN' >/dev/null
          {
            echo 'storeFile=bitchord-release.jks'
            printf 'storePassword=%s\n' "$CI_STORE_PASSWORD"
            echo 'keyAlias=bitchord-ci'
            printf 'keyPassword=%s\n' "$CI_STORE_PASSWORD"
          } > keystore.properties
        fi
    - name: Apply Pexpo bug fixes and legacy gate
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path

        def replace(path, old, new, label):
            p = Path(path)
            s = p.read_text()
            if old not in s:
                raise SystemExit(f"{label}: target text not found; refusing partial patch")
            if s.count(old) != 1:
                raise SystemExit(f"{label}: target occurs {s.count(old)} times; refusing ambiguous patch")
            p.write_text(s.replace(old, new))

        replace('app/src/main/java/com/music/bitchord/ui/MainViewModel.kt', '''    fun refreshGoogleAccounts() {
            _googleAccounts.value = authStore.sessions
            _activeAccountId.value = authStore.activeSession?.accountId
            _activeProfileId.value = authStore.activeProfileId
        }'''.replace('            ', '        '), '''    fun refreshGoogleAccounts() {
            _googleAccounts.value = authStore.sessions
            _activeAccountId.value = authStore.activeSession?.accountId
            _activeProfileId.value = authStore.activeProfileId

            // A fresh sign-in can have the session immediately while the YouTube
            // channel/profile thumbnails are still missing. Reuse the existing
            // authoritative channel fetch; its result updates the same session
            // objects while the selector is already open, so no restart is needed.
            if (authStore.sessions.any { session ->
                    session.profiles.any { profile -> profile.avatar.isNullOrBlank() }
                }) {
                loadChannels(force = true)
            }
        }'''.replace('            ', '        '), 'Bug #1 account refresh')

        replace('app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt', '''    val metered by AppSettings.meteredConnection.collectAsStateWithLifecycle()
''', '''    val metered by AppSettings.meteredConnection.collectAsStateWithLifecycle()
    val activeTransport = remember(metered) {
        val manager = context.getSystemService(android.net.ConnectivityManager::class.java)
        val network = manager?.activeNetwork
        val capabilities = network?.let { manager.getNetworkCapabilities(it) }
        when {
            capabilities?.hasTransport(android.net.NetworkCapabilities.TRANSPORT_WIFI) == true -> "wifi"
            capabilities?.hasTransport(android.net.NetworkCapabilities.TRANSPORT_CELLULAR) == true -> "cellular"
            else -> "other"
        }
    }
    val onWifi = activeTransport == "wifi"
    val onCellular = activeTransport == "cellular"
''', 'Bug #2 transport state')
        replace('app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt', 'badge = stringResource(R.string.in_use).takeIf { metered == false },', 'badge = stringResource(R.string.in_use).takeIf { onWifi },', 'Bug #2 Wi-Fi badge')
        replace('app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt', 'badge = stringResource(R.string.in_use).takeIf { metered == true },', 'badge = stringResource(R.string.in_use).takeIf { onCellular },', 'Bug #2 cellular badge')

        replace('app/src/main/java/com/music/bitchord/BitChordApplication.kt', 'import android.app.Application\n', 'import android.app.Activity\nimport android.app.AlertDialog\nimport android.app.Application\nimport android.content.Intent\nimport android.net.Uri\n', 'Legacy gate imports')
        replace('app/src/main/java/com/music/bitchord/BitChordApplication.kt', '''        super.onCreate()
''', '''        super.onCreate()
        registerActivityLifecycleCallbacks(object : ActivityLifecycleCallbacks {
            override fun onActivityCreated(activity: Activity, state: android.os.Bundle?) = Unit
            override fun onActivityStarted(activity: Activity) = Unit
            override fun onActivityPaused(activity: Activity) = Unit
            override fun onActivityStopped(activity: Activity) = Unit
            override fun onActivitySaveInstanceState(activity: Activity, state: android.os.Bundle) = Unit
            override fun onActivityDestroyed(activity: Activity) = Unit
            override fun onActivityResumed(activity: Activity) {
                if (isLegacyBuild()) showLegacyBuildGate(activity)
            }
        })
''', 'Legacy gate lifecycle')
        marker = '''    private fun initLastfm() {
'''
        addition = '''    private fun isLegacyBuild(): Boolean {
        fun key(version: String): List<Int> {
            val parts = version.removePrefix("v").split(".").map { it.toIntOrNull() ?: 0 }
            if (parts.size == 4 && parts[2] == 1) {
                return listOf(parts[0], parts[1], parts[3], 1)
            }
            return listOf(parts.getOrElse(0) { 0 }, parts.getOrElse(1) { 0 }, parts.getOrElse(2) { 0 }, 0)
        }
        val current = key(BuildConfig.VERSION_NAME)
        val minimum = key("1.5.1.4")
        return current.zip(minimum).firstOrNull { (a, b) -> a != b }?.let { it.first < it.second } == true
    }

    private fun showLegacyBuildGate(activity: Activity) {
        if (activity.isFinishing || activity.isDestroyed) return
        if (activity is androidx.appcompat.app.AppCompatActivity && activity.isChangingConfigurations) return
        AlertDialog.Builder(activity)
            .setTitle("Pexpo update required")
            .setMessage("This version of Pexpo is no longer supported. Please install Pexpo 1.5.1.4 or newer from Pexpo Updates.")
            .setCancelable(false)
            .setPositiveButton("Download latest") { _, _ ->
                activity.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://pexpoupdates.xo.je")))
                activity.finishAndRemoveTask()
            }
            .show()
    }

'''
        p = Path('app/src/main/java/com/music/bitchord/BitChordApplication.kt')
        s = p.read_text()
        if s.count(marker) != 1:
            raise SystemExit('Legacy gate method insertion target not unique')
        p.write_text(s.replace(marker, addition + marker))
        PY
        grep -q 'loadChannels(force = true)' app/src/main/java/com/music/bitchord/ui/MainViewModel.kt
        grep -q 'TRANSPORT_WIFI' app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt
        grep -q 'Pexpo update required' app/src/main/java/com/music/bitchord/BitChordApplication.kt
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Pexpo v1.5.1.4
      run: ./gradlew assembleProdRelease --stacktrace
    - name: Prepare release assets
      run: |
        set -euo pipefail
        mkdir -p release-assets
        cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk release-assets/pexpo-1.5.1.4-universal.apk
        cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk release-assets/pexpo-1.5.1.4-arm64-v8a.apk
        cp app/build/outputs/apk/prod/release/app-prod-armeabi-v7a-release.apk release-assets/pexpo-1.5.1.4-armeabi-v7a.apk
        cp app/build/outputs/apk/prod/release/app-prod-x86_64-release.apk release-assets/pexpo-1.5.1.4-x86_64.apk
        sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
    - name: Upload Pexpo 1.5.1.4 artifact
      uses: actions/upload-artifact@v4
      with:
        name: pexpo-v1.5.1.4-release
        path: release-assets/*
    - name: Publish GitHub Release v1.5.1.4
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if ! gh release view v1.5.1.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create v1.5.1.4 \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title 'Pexpo Music v1.5.1.4' \
            --notes 'Pexpo Music v1.5.1.4\n\n### Bug fixes\n- Fixed first-login account selector avatar refresh.\n- Fixed Wi-Fi/mobile transport indicator classification.\n- Added a legacy-build gate for builds below 1.5.1.4.'
        fi
        gh release upload v1.5.1.4 \
          --repo "$GITHUB_REPOSITORY" \
          --clobber \
          release-assets/pexpo-1.5.1.4-universal.apk \
          release-assets/pexpo-1.5.1.4-arm64-v8a.apk \
          release-assets/pexpo-1.5.1.4-armeabi-v7a.apk \
          release-assets/pexpo-1.5.1.4-x86_64.apk \
          release-assets/SHA256SUMS.txt
    - name: Remove superseded releases and Actions artifacts
      if: success()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name != "v1.5.1.4") | .tag_name' | while read -r tag; do
          [ -z "$tag" ] || gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
        done
        gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name != "pexpo-v1.5.1.4-release") | .id' | while read -r id; do
          [ -z "$id" ] || gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
        done
    - name: Commit patched source and clean temporary patch files
      if: always()
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add app/src/main app/src/main/res/values/strings.xml
        git rm -f scripts/patch_1514.py .github/workflows/one-time-pexpo-1514-account-adaptive.yml .github/workflows/run-1514-patch.yml .github/workflows/patch-pr.yml PATCH_TRIGGER.txt .github/workflows/one-time-pexpo-bugfix.yml 2>/dev/null || true
        if git diff --cached --quiet; then echo 'No source cleanup commit needed.'; exit 0; fi
        git commit -m 'fix: account avatar network indicator and legacy gate'
        git push origin main
