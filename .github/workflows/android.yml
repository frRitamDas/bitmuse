name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pexpo-android-${{ github.ref }}-${{ github.workflow_sha }}
  cancel-in-progress: true

jobs:
  build-dev-debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup local.properties
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      run: |
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
    - name: Apply maintenance patch
      run: python3 scripts/patch_155.py
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Dev Debug APK
      run: ./gradlew assembleDevDebug --stacktrace
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pexpo-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk

  build-prod-release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Validate and setup Last.fm credentials
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      run: |
        set -euo pipefail
        if [ -z "$LASTFM_API_KEY" ] || [ -z "$LASTFM_SECRET" ]; then
          echo 'LASTFM_API_KEY and LASTFM_SECRET repository Actions secrets are required for the production release.' >&2
          exit 1
        fi
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
    - name: Apply Pexpo 1.5.5 maintenance patch
      run: python3 scripts/patch_155.py
    - name: Setup permanent release signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          if [ -z "${!name}" ]; then
            echo "Missing required Actions secret: $name" >&2
            echo 'Configure the four permanent Pexpo signing secrets before running a production release.' >&2
            exit 1
          fi
        done
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > pexpo-release.jks
        if [ ! -s pexpo-release.jks ]; then
          echo 'KEYSTORE_BASE64 decoded to an empty keystore.' >&2
          exit 1
        fi
        if ! keytool -list -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
          echo 'Permanent Pexpo keystore validation failed: invalid keystore or password.' >&2
          exit 1
        fi
        if ! keytool -list -keystore pexpo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
          echo 'Permanent Pexpo keystore validation failed: KEY_ALIAS was not found.' >&2
          exit 1
        fi
        {
          echo 'storeFile=pexpo-release.jks'
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
          printf 'keyAlias=%s\n' "$KEY_ALIAS"
          printf 'keyPassword=%s\n' "$KEY_PASSWORD"
        } > keystore.properties
        echo 'Permanent Pexpo release keystore validated and selected.'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Pexpo v1.5.5
      run: ./gradlew assembleProdRelease --stacktrace
    - name: Prepare release assets
      run: |
        set -euo pipefail
        mkdir -p release-assets
        cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk release-assets/pexpo-1.5.5-universal.apk
        cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk release-assets/pexpo-1.5.5-arm64-v8a.apk
        cp app/build/outputs/apk/prod/release/app-prod-armeabi-v7a-release.apk release-assets/pexpo-1.5.5-armeabi-v7a.apk
        cp app/build/outputs/apk/prod/release/app-prod-x86_64-release.apk release-assets/pexpo-1.5.5-x86_64.apk
        sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
    - name: Upload Pexpo 1.5.5 artifact
      uses: actions/upload-artifact@v4
      with:
        name: pexpo-v1.5.5-release
        path: release-assets/*
    - name: Publish GitHub Release v1.5.5
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        NOTES=$(cat <<'EOF'
        Pexpo Music v1.5.5

        ### What's changed
        - Fixed account-button routing: signed-out users now go to Settings instead of seeing an empty account selector.
        - Signed-in users continue to get the account/profile selector from the Home account button.
        - Settings > Account & integrations > Listen as now opens the same account/profile selector used on Home.
        - Preserved immediate first-login account/avatar refresh behavior.
        - Removed the temporary legacy-version shutdown gate; older Pexpo versions remain usable.
        - Preserved the normal optional update flow with Install now / Later.
        - Production builds now require configured Last.fm API credentials, fixing Last.fm login builds that silently shipped without credentials.
        - Fixed Canvas network gating so Wi-Fi always permits animated covers while the cellular preference only applies on cellular transport.
        - Renamed the BitChord source/package identity to Pexpo without changing unrelated application behavior.
        - Production APKs are signed only with the configured permanent Pexpo release keystore.

        ### Downloads
        Universal, arm64-v8a, armeabi-v7a and x86_64 APKs are attached, with SHA-256 checksums.
        EOF
        )
        if gh release view v1.5.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release edit v1.5.5 --repo "$GITHUB_REPOSITORY" --title 'Pexpo Music v1.5.5' --notes "$NOTES"
        else
          gh release create v1.5.5 --repo "$GITHUB_REPOSITORY" --target main --title 'Pexpo Music v1.5.5' --notes "$NOTES"
        fi
        gh release upload v1.5.5 \
          --repo "$GITHUB_REPOSITORY" \
          --clobber \
          release-assets/pexpo-1.5.5-universal.apk \
          release-assets/pexpo-1.5.5-arm64-v8a.apk \
          release-assets/pexpo-1.5.5-armeabi-v7a.apk \
          release-assets/pexpo-1.5.5-x86_64.apk \
          release-assets/SHA256SUMS.txt
    - name: Remove superseded Actions artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name != "pexpo-v1.5.5-release") | .id' | while read -r id; do
          [ -z "$id" ] || gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
        done
    - name: Finalize patched source
      if: success()
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add app/src app/build.gradle.kts scripts README.md
        if git diff --cached --quiet; then echo 'Source already finalized.'; exit 0; fi
        git commit -m 'fix: finalize Pexpo 1.5.5 maintenance patches'
        git push origin main
