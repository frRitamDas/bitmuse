name: Build Pexpo
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - run: chmod +x gradlew
      - run:./gradlew assembleDevDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pexpo-APK
          path: app/build/outputs/apk/dev/debug/*.apk
