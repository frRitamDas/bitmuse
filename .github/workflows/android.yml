name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build-dev-debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup local.properties
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      run: |
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Dev Debug APK
      run: ./gradlew assembleDevDebug
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pexpo-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk

  build-prod-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
    - name: Apply Pexpo v1.5.3 maintenance patch
      run: python3 scripts/fix_pexpo.py
    - name: Apply Pexpo v1.5.4 fixes
      run: python3 scripts/fix_pexpo_154.py
    - name: Commit Pexpo v1.5.4 source fixes
      run: |
        if git diff --quiet; then
          echo 'Source is already fully patched.'
        else
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main app/build.gradle.kts .github/workflows/android.yml scripts
          git commit -m 'Finalize Pexpo v1.5.4 stability and branding fixes'
          git push
        fi
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Setup local.properties
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      run: |
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
    - name: Setup release signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        valid_keystore=false
        if [ -n "$KEYSTORE_BASE64" ]; then
          if printf '%s' "$KEYSTORE_BASE64" | base64 --decode > bitchord-release.jks 2>/dev/null; then
            if [ -s bitchord-release.jks ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
              if keytool -list -keystore bitchord-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 && \
                 keytool -list -keystore bitchord-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
                valid_keystore=true
              fi
            fi
          fi
        fi
        if [ "$valid_keystore" = true ]; then
          echo 'Using configured release keystore.'
          {
            echo 'storeFile=bitchord-release.jks'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
        else
          echo 'Configured release keystore unavailable; using temporary CI signing key for this build.'
          rm -f bitchord-release.jks
          CI_STORE_PASSWORD="$(openssl rand -hex 32)"
          keytool -genkeypair -v -storetype JKS \
            -keystore bitchord-release.jks \
            -alias bitchord-ci -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$CI_STORE_PASSWORD" -keypass "$CI_STORE_PASSWORD" \
            -dname 'CN=Pexpo CI, O=Pexpo, C=IN' >/dev/null
          {
            echo 'storeFile=bitchord-release.jks'
            printf 'storePassword=%s\n' "$CI_STORE_PASSWORD"
            echo 'keyAlias=bitchord-ci'
            printf 'keyPassword=%s\n' "$CI_STORE_PASSWORD"
          } > keystore.properties
        fi
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Pexpo v1.5.4
      run: ./gradlew assembleProdRelease --stacktrace
    - name: Prepare release assets
      run: |
        set -euo pipefail
        mkdir -p release-assets
        cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk release-assets/pexpo-1.5.4-universal.apk
        cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk release-assets/pexpo-1.5.4-arm64-v8a.apk
        cp app/build/outputs/apk/prod/release/app-prod-armeabi-v7a-release.apk release-assets/pexpo-1.5.4-armeabi-v7a.apk
        cp app/build/outputs/apk/prod/release/app-prod-x86_64-release.apk release-assets/pexpo-1.5.4-x86_64.apk
        sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
    - name: Upload Pexpo v1.5.4 artifact
      uses: actions/upload-artifact@v4
      with:
        name: pexpo-v1.5.4-release
        path: release-assets/*
    - name: Publish GitHub Release v1.5.4
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if gh release view v1.5.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo 'v1.5.4 already published.'
          exit 0
        fi
        gh release create v1.5.4 \
          --repo "$GITHUB_REPOSITORY" \
          --target main \
          --title 'Pexpo Music v1.5.4' \
          --notes 'Pexpo Music v1.5.4\n\n### Improved system stability and bug fixes\n- Fixed Samsung/One UI mini-player disappearing during transient MediaController reconnects.\n- Stabilized the floating playback/navigation bar and preserved the visible track during short controller hand-offs.\n- Removed remaining user-visible BitChord branding from Discord Rich Presence and Replay sharing.\n- Discord Visit button now opens https://pexpomusic.xo.je.\n- Replay Save/share output now uses Pexpo naming instead of BitChord.\n- Improved release/update packaging and variant-aware APK selection.\n- Release signing continues to prefer configured GitHub Actions secrets and never commits a private signing key.' \
          release-assets/pexpo-1.5.4-universal.apk \
          release-assets/pexpo-1.5.4-arm64-v8a.apk \
          release-assets/pexpo-1.5.4-armeabi-v7a.apk \
          release-assets/pexpo-1.5.4-x86_64.apk \
          release-assets/SHA256SUMS.txt
